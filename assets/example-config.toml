# herdr-gitview configuration
# Location: $HERDR_PLUGIN_CONFIG_DIR/config.toml
#   (usually ~/.config/herdr/plugins/chmarax.gitview/config.toml)
# Every key is optional; the values below are the defaults.

# Base ref for branch scope (`w` toggles worktree <-> branch view).
# "" = auto-detect: origin/HEAD -> origin/main -> origin/master -> main -> master
base = ""

# Which side the file list sits on: "right" | "left".
list_side = "right"

# Editor argv. The file (and "+<line>" when the first changed line is known)
# is appended. Also used as GIT_EDITOR for `c` (commit) unless you already
# configured git's core.editor or $GIT_EDITOR.
editor = ["nvim"]

# Auto-refresh interval in milliseconds; 0 disables polling. A non-zero
# value is floored at 250 ms so a tiny interval can't hammer git.
poll_ms = 2000

# Extra refs the commit history (`l`) shows alongside HEAD, so a push to an
# integration branch turns up without leaving the view. Their commits are
# interleaved by date and labelled, e.g. `[staging]`.
#
# Deliberately a short list rather than every branch: a working repo can carry
# hundreds, and interleaving all of them buries your own history. This list
# also bounds which refs get labelled — a commit can be pointed at by dozens.
#
# Refs that don't exist in a repo are dropped silently, so one config works
# across repos with different branch names. [] disables the whole feature.
log_refs = ["origin/staging"]

# How often to `git fetch` those refs, in milliseconds; 0 disables it. A
# remote ref only moves when something fetches, so without this the history
# is as stale as your last manual `git fetch` — and a push you were waiting
# for simply won't appear.
#
# Only the watched refs are fetched, never the whole remote. The fetch is
# non-interactive (it fails rather than prompting for an SSH passphrase), and
# failures are silent: offline is normal. Instances sharing a repo — linked
# worktrees in one herdr session — single-flight through a timestamp file, so
# four views don't mean four fetches.
#
# Floored at 30 s when non-zero. This is network I/O, not a local poll.
fetch_interval_ms = 300000

# Which scope the view opens in: "worktree" (staged/unstaged changes) or
# "branch" (diff vs the merge base). `w` toggles at runtime.
default_scope = "worktree"

# Unchanged context lines kept around each change before the rest folds
# (git's diff.context equivalent). Clamped to 0..20.
context_lines = 3

# Show untracked files in the worktree view.
show_untracked = true

# Diff colors: "dark" (default) or "light" — picks the syntax-highlighting
# theme and the red/green line-background tints. Use "light" if your
# terminal has a light background.
theme = "dark"

# Override any default keybinding: action = "key".
# Key grammar: [ctrl+][alt+][shift+]<key>, where <key> is a single character
# or: enter, esc, tab, space, up, down, left, right, pgup, pgdn, home, end.
# An override replaces ALL default keys for that action.
# Binding a key that another action already owns is reported at startup and
# the whole table is ignored (defaults win) — fix the collision to apply it.
[keybindings]
# down = "j"                # also: down-arrow
# up = "k"                  # also: up-arrow
# top = "g"
# bottom = "shift+g"
# edit = "enter"            # open the file in your editor (left pane)
# scroll_down = "shift+j"   # scroll the diff without leaving the list
# scroll_up = "shift+k"
# half_page_down = "ctrl+d"
# half_page_up = "ctrl+u"
# diff_top = "home"
# diff_bottom = "end"
# toggle_scope = "w"        # worktree <-> branch
# toggle_cached = "tab"     # unstaged <-> staged diff view
# stage = "s"
# unstage = "u"
# discard = "x"
# commit = "c"
# log = "l"                 # commit history
# Review threads:
# select = "v"              # start/extend a line selection in the diff
# annotate = "a"            # open a thread on the selection (or whole file)
# send_notes = "p"          # send everything unsent to an agent pane
# notes_view = "n"          # list every thread in the repo
# delete = "d"              # delete the selected thread (notes view)
# toggle_thread = "z"       # collapse/expand a thread card in the diff
# commit_message = "m"      # read the selected commit's full message (log view)
# refresh = "r"
# help = "?"
# quit = "q"                # also: esc
